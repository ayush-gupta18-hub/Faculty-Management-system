<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LNMIIT Faculty System</title>

    <!-- SAME STYLES -->
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="auth-container">

        <div class="form-card auth-card">

            <!-- Logo -->
            <div style="text-align:center; margin-bottom:20px;">
                <img src="lnmiit_logo.png" style="width:60px;">
                <h2 style="margin-top:10px;">Faculty Management</h2>
            </div>

            <!-- LOGIN -->
            <div id="login-box">
                <h3>Login</h3>

                <form id="loginForm">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="loginEmail"required>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="loginPassword" required>
                    </div>

                    <button class="btn-primary full-width">Login</button>
                </form>

                <p class="auth-switch">
                    Don’t have an account?
                    <span onclick="register()">Register</span>
                </p>
            </div>

            <!-- REGISTER -->
            <div id="register-box" class="hidden">
                <h3>Register</h3>

                <form id="registerForm">
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" required>
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="registerEmail"required>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="registerPassword" required>
                    </div>

                    <button class="btn-primary full-width">Register</button>
                </form>

                <p class="auth-switch">
                    Already have an account?
                    <span onclick="login()">Login</span>
                </p>
            </div>

        </div>

    </div>

    <script src="auth.js"></script>
</body>
</html>
