<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | LNMIIT Faculty Management System</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ── Auth page overrides ─────────────────────────────── */
        body {
            background: #f0f2f5;
        }

        .auth-container {
            background: #f0f2f5;
        }

        .auth-card {
            width: 480px;
            padding: 2.5rem 2.75rem;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        }

        /* ── Logo / header block ────────────────────────────── */
        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .auth-header img {
            width: 90px;
            margin-bottom: 14px;
        }

        .auth-header h1 {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 4px;
            letter-spacing: -0.3px;
        }

        .auth-header p {
            font-size: 0.78rem;
            color: var(--text-muted);
            letter-spacing: 0.3px;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* ── Section headings ───────────────────────────────── */
        .auth-section-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 1.25rem;
        }

        /* ── Labels ─────────────────────────────────────────── */
        .form-group label {
            font-size: 0.82rem;
            font-weight: 600;
            color: #374151;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ── Role selector pills ─────────────────────────────── */
        .role-selector {
            display: flex;
            gap: 10px;
            margin-top: 6px;
            margin-bottom: 6px;
        }

        .role-pill {
            flex: 1;
            padding: 10px 14px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            cursor: pointer;
            text-align: center;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.18s ease;
            letter-spacing: 0.2px;
        }

        .role-pill:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: #f8faff;
        }

        .role-pill.selected {
            border-color: var(--primary);
            background: #eef2fa;
            color: var(--primary);
        }

        .role-pill.selected.hod-pill {
            border-color: #b45309;
            background: #fffbeb;
            color: #92400e;
        }

        .role-pill.hod-pill:hover {
            border-color: #b45309;
            color: #92400e;
            background: #fffbeb;
        }

        .role-hint {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            min-height: 16px;
            letter-spacing: 0.1px;
        }

        /* ── Department reveal ───────────────────────────────── */
        #dept-group {
            transition: opacity 0.25s, max-height 0.25s;
            max-height: 80px;
            overflow: hidden;
        }

        #dept-group.hidden {
            max-height: 0;
            opacity: 0;
            pointer-events: none;
            margin: 0;
            padding: 0;
        }

        /* ── Error box ───────────────────────────────────────── */
        .auth-error {
            background: #fef2f2;
            border: 1px solid #fca5a5;
            color: #b91c1c;
            border-radius: 6px;
            padding: 9px 14px;
            font-size: 0.82rem;
            margin-top: 10px;
            display: none;
        }

        .auth-error.visible {
            display: block;
        }

        /* ── Switch link ─────────────────────────────────────── */
        .auth-switch {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: 1.25rem;
        }

        .auth-switch span {
            color: var(--primary);
            cursor: pointer;
            font-weight: 600;
        }

        .auth-switch span:hover {
            text-decoration: underline;
        }

        /* ── Button ──────────────────────────────────────────── */
        .btn-primary.full-width {
            margin-top: 1.25rem;
            padding: 0.7rem;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="form-card auth-card">

            <!-- Header -->
            <div class="auth-header">
                <img src="lnmiit_logo.png" alt="LNMIIT Logo">
                <h1>Faculty Management System</h1>
                <p>LNMIIT Role-Based Access Portal</p>
            </div>

            <!-- LOGIN -->
            <div id="login-box">
                <p class="auth-section-title">Sign In</p>

                <form id="loginForm" autocomplete="off">
                    <div class="form-group">
                        <label for="loginEmail">Email Address</label>
                        <input type="email" id="loginEmail" placeholder="you@lnmiit.ac.in" required>
                    </div>

                    <div class="form-group" style="margin-top:1rem;">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" placeholder="Enter your password" required>
                    </div>

                    <div class="auth-error" id="login-error"></div>

                    <button class="btn-primary full-width" type="submit">Sign In</button>
                </form>

                <p class="auth-switch">
                    Don't have an account?
                    <span onclick="showRegister()">Register</span>
                </p>
            </div>

            <!-- REGISTER -->
            <div id="register-box" class="hidden">
                <p class="auth-section-title">Create Account</p>

                <form id="registerForm" autocomplete="off">
                    <!-- Role Selector -->
                    <div class="form-group">
                        <label>Role</label>
                        <div class="role-selector">
                            <div class="role-pill selected" id="pill-super_admin" onclick="selectRole('super_admin')">
                                Super Admin
                            </div>
                            <div class="role-pill hod-pill" id="pill-hod" onclick="selectRole('hod')">
                                HOD
                            </div>
                        </div>
                        <p class="role-hint" id="role-hint">Administrative access</p>
                        <input type="hidden" id="selectedRole" value="super_admin">
                    </div>

                    <!-- Department (HOD only) -->
                    <div class="form-group hidden" id="dept-group" style="margin-top:0.75rem;">
                        <label for="registerDept">Department</label>
                        <select id="registerDept">
                            <option value="" disabled selected>Select Department</option>
                            <option value="CSE">Computer Science &amp; Engineering</option>
                            <option value="ECE">Electronics &amp; Communication</option>
                            <option value="CCE">Computer &amp; Communication Engineering</option>
                            <option value="ME">Mechanical Engineering</option>
                            <option value="Mathematics">Mathematics</option>
                            <option value="Physics">Physics</option>
                            <option value="HSS">Humanities &amp; Social Sciences</option>
                        </select>
                    </div>

                    <div class="form-group" style="margin-top:0.75rem;">
                        <label for="registerEmail">Email Address</label>
                        <input type="email" id="registerEmail" placeholder="you@lnmiit.ac.in" required>
                    </div>

                    <div class="form-group" style="margin-top:0.75rem;">
                        <label for="registerPassword">Password</label>
                        <input type="password" id="registerPassword" placeholder="Choose a strong password" required>
                    </div>

                    <div class="auth-error" id="register-error"></div>

                    <button class="btn-primary full-width" type="submit">Create Account</button>
                </form>

                <p class="auth-switch">
                    Already have an account?
                    <span onclick="showLogin()">Sign In</span>
                </p>
            </div>

        </div>
    </div>

    <script src="auth.js"></script>
</body>

</html>
